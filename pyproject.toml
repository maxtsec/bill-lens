[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bill-lens"
version = "0.1.0"
description = "Verifiable electricity bill extraction"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3", "pdfplumber>=0.11.9,<0.12",
    "SQLAlchemy==2.0.54", "psycopg[binary]==3.3.6", "alembic==1.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4.4.9,<5"]

[tool.setuptools.packages.find]
include = ["bill_lens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: requires real PostgreSQL via TEST_DATABASE_URL"]
