[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bill-lens"
version = "0.1.0"
description = "Verifiable electricity bill extraction"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "pdfplumber>=0.11.9,<0.12"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4.4.9,<5"]

[tool.setuptools.packages.find]
include = ["bill_lens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
